name: Power Lattice
description: 'Power Lattice (Powerlattice) is a semiconductor and power-management
  startup building power delivery solutions for AI accelerators and GPUs. Its core
  product is an industry-first power delivery chiplet that integrates voltage regulation
  directly into the processor package, addressing the data-center "power wall" as AI
  chips push past 2,000 watts. The Rainier micro-IVR architecture combines miniaturized
  on-die magnetic inductors, advanced control-circuit innovations, a vertical design,
  and a programmable software layer to deliver 50%+ power reduction, 2-3X performance-per-watt
  gains, and extended system lifetime. Backed by Playground Global, the company raised
  $25M to break the AI power wall. This is a hardware company with no public developer
  API surface.'
